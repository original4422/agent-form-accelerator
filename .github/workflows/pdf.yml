name: PDF source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r prototype/requirements-pdf.txt
      - run: npm run check:pdf
      - run: npx playwright install --with-deps chromium
      - run: npm run check:receipt
        env:
          AFA_RECEIPT_PDF: '1'
      - run: npm run check:reload
        env:
          AFA_RELOAD_PDF: '1'
      - run: npm run check:attachment
        env:
          AFA_ATTACHMENT_PDF: '1'
